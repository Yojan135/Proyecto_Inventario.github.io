<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EYAY - Iniciar Sesión</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body style="background-color: #FFE4B5;">

  <main class="container my-5">
    <div class="row align-items-center">
            
      <div class="col-md-6 pe-md-5">
        <form action="#" method="POST">
          <h2 class="fw-bold text-dark mb-2">Iniciar sesión</h2>
          <p class="text-muted small mb-4">Los campos obligatorios están marcados con un asterisco*.</p>
        
          <div class="mb-3">
            <input type="email" class="form-control rounded-3 py-3" placeholder="*Ingrese su correo electrónico" required>
          </div>
          
          <div class="mb-3">
            <input type="password" class="form-control rounded-3 py-3" placeholder="*Introduzca la contraseña" required>
          </div>          
       
          <div class="mb-4">
            <a href="index_olvide_password.html" class="text-success fw-semibold text-decoration-none small">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="d-flex gap-3 mt-4">
  <a class="btn btn-warning rounded-pill px-4 py-2 fw-bold text-dark shadow-sm" href="dashboard.html">Ingresar</a>
  <a href="index.html" class="btn btn-outline-dark rounded-pill px-4 py-2 fw-bold text-decoration-none">
    Volver
     </a>
     </div>

       </form>
       </div>


        <div class="col-md-6 text-center d-none d-md-block">
        <img src="imagenes/logo.jpg" alt="EyAy Té que Conecta" class="img-fluid rounded-4 shadow-lg" style="max-width: 440px; width: 100%;">
      </div>
    </div>
  </main>

</body>
</html>
