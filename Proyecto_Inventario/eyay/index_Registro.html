<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EyAy - Registro</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body style="background-color: #FFE4B5;">

 
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4" style="background-color: #B9C4B1;">
    <div class="container">
      
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="imagenes/logo.jpg" alt="Logo" width="50" height="50" class="rounded-circle">
      </a>

      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="index_Registro.html" class="btn btn-dark rounded-pill px-4 fw-bold shadow-sm text-decoration-none">
          Registrarse
        </a>
        <a href="index_inicio_sesion.html" class="btn btn-outline-dark rounded-pill px-4 fw-bold text-decoration-none">
          Iniciar sesión
        </a>
      </div>

    </div>
  </nav>


  <main class="container my-5">
    <div class="row align-items-center">
      
     
      <div class="col-md-6 pe-md-5">
        <form action="#" method="POST">
          <h3 class="fw-bold text-dark mb-4">Información personal</h3>

          <div class="mb-3">
            <input type="text" class="form-control rounded-3 py-3" placeholder="*Nombre" required>
          </div>

          <div class="mb-3">
            <input type="text" class="form-control rounded-3 py-3" placeholder="*Apellido" required>
          </div>

          <h3 class="fw-bold text-dark mt-4 mb-4">Datos del Usuario</h3>

          <div class="mb-3">
            <input type="email" class="form-control rounded-3 py-3" placeholder="*Correo Electronico" required>
          </div>

          <div class="mb-4">
            <input type="password" class="form-control rounded-3 py-3" placeholder="*Contraseña" required>
          </div>

          <!-- Botones de Acción -->
          <div class="d-flex gap-3 mb-4">
            <button type="submit" class="btn btn-warning rounded-pill px-4 py-2 fw-bold text-dark shadow-sm">
              Registrarse
            </button>
            <a href="index.html" class="btn btn-outline-dark rounded-pill px-4 py-2 fw-bold text-decoration-none">
              Volver
            </a>
          </div>
        </form>
      </div>

      
      <div class="col-md-6 text-center d-none d-md-block">
        <img src="imagenes/logo.jpg" alt="EyAy Té que Conecta" class="img-fluid rounded-4 shadow-lg" style="max-width: 440px; width: 100%;">
      </div>

    </div>
  </main>

</body>
</html>
